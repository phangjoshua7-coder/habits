    <!-- Main React App code -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ----------------- RETRO AUDIO SYNTHESIS ENGINE -----------------
      class AudioPlayer {
        constructor() {
          this.ctx = null;
        }
        init() {
          if (!this.ctx) {
            const AudioContextClass = window.AudioContext || (window).webkitAudioContext;
            if (AudioContextClass) {
              this.ctx = new AudioContextClass();
            }
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume();
          }
        }
        playCompletion() {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = "sine";
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
            osc.frequency.setValueAtTime(1046.5, now + 0.3); // C6

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.45);
          } catch(e) { console.warn(e); }
        }
        playSmash() {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = "triangle";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } catch(e) { console.warn(e); }
        }
        playCoin() {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const playChime = (delay, freq) => {
              if (!this.ctx) return;
              const t = this.ctx.currentTime + delay;
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = "sine";
              o.frequency.setValueAtTime(freq, t);
              g.gain.setValueAtTime(0.1, t);
              g.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(t);
              o.stop(t + 0.18);
            };
            playChime(0, 987.77);  // B5
            playChime(0.06, 1318.51); // E6
          } catch(e) { console.warn(e); }
        }
        playLevelUp() {
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
              if (!this.ctx) return;
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = "sawtooth";
              o.frequency.setValueAtTime(freq, now + i * 0.08);
              g.gain.setValueAtTime(0.05, now + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.18);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + i * 0.08);
              o.stop(now + i * 0.08 + 0.2);
            });
          } catch(e) { console.warn(e); }
        }
      }
      const sound = new AudioPlayer();

                level >= 5 ? "bg-amber-500/20" : level >= 3 ? "bg-purple-500/15" : "bg-emerald-500/10"

            {/* Avatar drawing vector */}
            <svg

              {/* Racket of Rival */}

      // ----------------- TOAST SYSTEM -----------------
      const ToastContainer = ({ toasts, removeToast }) => {

          <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center space-y-2 w-full max-w-[320px] pointer-events-none px-4">

              return (

                    onClick={() => removeToast(t.id)}

      // ----------------- GYM EYE AI SCANNER MODAL -----------------
      const GymEyeModal = ({ isOpen, habit, onClose, onVerified, showToast }) => {
        const [activeStep, setActiveStep] = useState("camera"); // camera | simulator
        const [uploading, setUploading] = useState(false);
        const [isProcessing, setIsProcessing] = useState(false);
        const [simLogs, setSimLogs] = useState("");

        useEffect(() => {
          if (habit) {
            setActiveStep("camera");
            setUploading(false);
            setIsProcessing(false);
            // Dynamic telemetry data mockups to emulate real hardware scanners
            const sampleTelemetry = {
              "habitId": habit.id,
              "sensor_engine_state": "ACTIVE_COURT_POSE",
              "gforce_axes": { "x": 0.12, "y": -0.45, "z": 0.98 },
              "frequency_check": "1.33Hz (Consistent swings detected)",
              "telemetry_log_string": `Simulating active gym routine loop logs for routine metric: ${habit.name}. Target checked.`
            };
            setSimLogs(JSON.stringify(sampleTelemetry, null, 2));
          }
        }, [habit]);

        if (!isOpen || !habit) return null;

        const handleActionTrigger = () => {
          setIsProcessing(true);
          sound.playSmash();
          
          setTimeout(() => {
            setIsProcessing(false);
            // Triggers reward on successful local simulations
            let rewardXp = habit.xpReward;
            let rewardCoins = 10;
            if (habit.id === "habit2") rewardCoins = 15;
            if (habit.id === "habit3") rewardCoins = 25;

            const feedbackMessages = [
              "Sensational stance discipline verified! Camera tracking observed deep squats and straight knee alignments. Incredibly athletic routine done! +Reward fully added.",
              "Study focus telemetry confirmed. Zero high-flicker rapid shifts. Excellent tactical reading! Mental state index in focus green zone.",
              "Aerobic swing intensity checked. High kinetic G-forces matches premium champion drills. Smashed perfectly!"
            ];

            const chosenMessage = feedbackMessages[Math.floor(Math.random() * feedbackMessages.length)];
            onVerified(habit.id, rewardXp, rewardCoins, chosenMessage);
          }, 1500); // 1.5s professional delay simulating AI scanning
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
            <div className="relative bg-[#161616] border-2 border-secondary/20 rounded-[28px] max-w-sm w-full p-5 shadow-2xl relative z-10 space-y-4">

                  <textarea 
                    value={simLogs} 
                    onChange={(e) => setSimLogs(e.target.value)}
                    className="w-full h-32 bg-black font-mono text-[9px] text-[#00FFCC] p-3 rounded-xl border border-zinc-900 focus:outline-none focus:border-secondary" 
                  />

              )}

              {/* Actions */}
              <button 
                onClick={handleActionTrigger}
                disabled={isProcessing}
                className="w-full bg-secondary text-primary font-black py-2.5 rounded-full text-xs font-sans tracking-widest uppercase hover:opacity-90 transition-opacity flex items-center justify-center space-x-2"
              >
                {isProcessing ? (
                  <>
                    <svg className="animate-spin h-3.5 w-3.5 text-primary" viewBox="0 0 24 24" fill="none">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <span>ANALYST EVALUATING...</span>
                  </>
                ) : (
                  <span>RUN VISION VERIFY SCAN</span>
                )}
              </button>
            </div>
          </div>
        );
      };

      // ----------------- MAIN APP COMPONENT CONTAINER -----------------
      function App() {
        // UI states
        const [activeTab, setActiveTab] = useState("home"); // home | stats | shop | journal | more
        const [moreSubTab, setMoreSubTab] = useState("leaderboard"); // leaderboard | calendar | challenges | specs
        const [toasts, setToasts] = useState([]);
        const [countdownString, setCountdownString] = useState("12:00:00");
        const [selectedHabitForAI, setSelectedHabitForAI] = useState(null);
        
        // Battle effects state
        const [isSmashing, setIsSmashing] = useState(false);
        const [enemyShake, setEnemyShake] = useState(false);
        const [showLevelUpCinematic, setShowLevelUpCinematic] = useState(null);
        const [showPerfectBonusBanner, setShowPerfectBonusBanner] = useState(false);

        // Core data State Engine (Category B / C - dynamic metrics state tracker)
        const [profile, setProfile] = useState({
          userId: "GUEST",
          email: "sportguest@readysetgo.io",
          xp: 0,
          coins: 40,
          level: 1,
          hp: 100,
          streak: 0,
          perfectDaysCount: 0,
          smashPowerLevel: 1,
          lastCheckDate: "",
          purchasedItems: [],
          currentRacket: "wood",
          currentShirt: "casual",
          currentPants: "casual",
          badges: ["Cadet Recruit"],
          statsWeeklyXP: [45, 90, 120, 30, 110, 80, 0]
        });

        const [habits, setHabits] = useState(DEFAULT_HABITS);
        const [challenges, setChallenges] = useState([
          { id: "ch1", name: "Rival Li Ning Smasher Quest", description: "Clear 3 daily habits entirely today.", target: 3, current: 0, rewardCoins: 30, completed: false },
          { id: "ch2", name: "Study Marathon Mind Mastery", description: "Practice study focused core timers.", target: 2, current: 0, rewardCoins: 20, completed: false }
        ]);

        const [journalNote, setJournalNote] = useState("");
        const [journalEntries, setJournalEntries] = useState([
          { date: "Yesterday", note: "Successfully loaded early badminton swings. Hydrated neatly! Core physical is stable flat." }
        ]);

        // AI Coach lab custom overlays - variables
        const [activeCoachLayer, setActiveCoachLayer] = useState("vision"); // vision | cognitive | optimization
        const [mealText, setMealText] = useState("");
        const [mealResult, setMealResult] = useState(null);
        const [aiProcessing, setAiProcessing] = useState(false);
        const [stretchClock, setStretchClock] = useState(null);
        const [stretchSeconds, setStretchSeconds] = useState(60);
        const [sunlightResult, setSunlightResult] = useState(null);
        const [feynmanResult, setFeynmanResult] = useState(null);
        const [feynmanText, setFeynmanText] = useState("");
        const [coachSpeechStyle, setCoachSpeechStyle] = useState("coach_li_ning"); // drill_sergeant | sarcastic_robot | coach_li_ning

        // Toast dispatch UI Helper
        const showToast = (text, type = "success") => {
          const id = Math.random().toString();
          setToasts((prev) => [...prev, { id, text, type }]);
          setTimeout(() => removeToast(id), 3000);
        };
        const removeToast = (id) => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        };

        // Firebase Sync Loader & Date Attacking checks
        useEffect(() => {
          // Initialize countdown clock
          const timer = setInterval(() => {
            const now = new Date();
            const tomorrow = new Date();
            tomorrow.setHours(23, 59, 59, 999);
            const diff = tomorrow - now;
            const hrs = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, "0");
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, "0");
            const secs = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, "0");
            setCountdownString(`${hrs}:${mins}:${secs}`);
          }, 1000);

          // Standard local storage recovery fallback
          const savedProf = localStorage.getItem("setgo_prof");
          const savedHabits = localStorage.getItem("setgo_habits");
          const savedChallenges = localStorage.getItem("setgo_chall");
          const savedLogs = localStorage.getItem("setgo_logs");

          let recoveredProf = null;
          if (savedProf) {
            try {
              recoveredProf = JSON.parse(savedProf);
              setProfile(recoveredProf);
            } catch(e) { console.error(e); }
          }
          if (savedHabits) {
            try { setHabits(JSON.parse(savedHabits)); } catch(e) {}
          }
          if (savedChallenges) {
            try { setChallenges(JSON.parse(savedChallenges)); } catch(e) {}
          }
          if (savedLogs) {
            try { setJournalEntries(JSON.parse(savedLogs)); } catch(e) {}
          }

          // Trigger Yesterday Misses Health penalties check date (HP depletion)
          setTimeout(() => {
            const targetProfile = recoveredProf || profile;
            const todayStr = new Date().toISOString().split("T")[0];
            if (targetProfile.lastCheckDate && targetProfile.lastCheckDate !== todayStr) {
              // Deduct Health! Boss rival attacked!
              showToast("🚨 YESTERDAY INERTIA HAS BROKEN DISCIPLINE! Bad Habit boss attacked! -25 Stamina (HP)", "warning");
              sound.playSmash();
              setProfile((prev) => {
                const newHp = Math.max(10, prev.hp - 25);
                const isLiNingSteal = getEnemyDetails(prev.xp).id === "lining";
                const coinDeduction = isLiNingSteal ? 1 : 0; // Li Ning stole 1 coin penalty
                const finalCoins = Math.max(0, prev.coins - coinDeduction);
                
                const updated = { 
                  ...prev, 
                  hp: newHp, 
                  coins: finalCoins,
                  lastCheckDate: todayStr 
                };
                localStorage.setItem("setgo_prof", JSON.stringify(updated));
                return updated;
              });
            } else if (!targetProfile.lastCheckDate) {
              setProfile(prev => ({ ...prev, lastCheckDate: todayStr }));
            }
          }, 800);

          // Hook into Firebase Cloud Firestore backup
          if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
            const authInstance = window.firebase.auth();
            authInstance.onAuthStateChanged(async (u) => {
              if (u) {
                showToast(`Cloud Profile Synced: ${u.displayName || u.email}!`, "success");
                try {
                  const dbInstance = window.firebase.firestore();
                  const snap = await dbInstance.collection("users").doc(u.uid).get();
                  if (snap.exists()) {
                    const cloudData = snap.data();
                    setProfile(cloudData);
                    localStorage.setItem("setgo_prof", JSON.stringify(cloudData));
                  }
                } catch(e) { console.warn("Cloud Firestore reading failed, keeping local sandbox."); }
              }
            });
          }

          return () => clearInterval(timer);
        }, []);

        // Google Sign-In popups auth helpers
        const handleGoogleLink = async () => {
          if (!window.firebase || !window.firebase.auth) {
            showToast("Firebase configurations not loaded. Operating locally sandboxed!", "warning");
            return;
          }
          try {
            const prov = new window.firebase.auth.GoogleAuthProvider();
            const result = await window.firebase.auth().signInWithPopup(prov);
            if (result.user) {
              // Write a default schema profile
              const todayStr = new Date().toISOString().split("T")[0];
              const userRef = window.firebase.firestore().collection("users").doc(result.user.uid);
              const userSnapshot = await userRef.get();
              
              let currentProf = profile;
              if (userSnapshot.exists()) {
                currentProf = userSnapshot.data();
              } else {
                currentProf = { 
                  ...profile, 
                  userId: result.user.uid, 
                  email: result.user.email,
                  lastCheckDate: todayStr 
                };
                await userRef.set(currentProf);
              }
              setProfile(currentProf);
              localStorage.setItem("setgo_prof", JSON.stringify(currentProf));
              showToast(`Successfully connected: ${result.user.displayName}`, "success");
            }
          } catch(err) {
            console.error(err);
            showToast("Google connection failed or cancelled by viewport.", "warning");
          }
        };

        const handleGoogleDisconnect = async () => {
          if (window.firebase && window.firebase.auth) {
            await window.firebase.auth().signOut();
            showToast("Disconnected secure cloud account details.", "success");
          }
          setProfile(prev => ({ ...prev, userId: "GUEST", email: "guest@readysetgo.io" }));
        };

        // Storage saver tool
        const saveState = (updatedProf, updatedHabits) => {
          localStorage.setItem("setgo_prof", JSON.stringify(updatedProf));
          localStorage.setItem("setgo_habits", JSON.stringify(updatedHabits));

          if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
            const curUser = window.firebase.auth().currentUser;
            if (curUser) {
              const uRef = window.firebase.firestore().collection("users").doc(curUser.uid);
              uRef.set(updatedProf, { merge: true }).catch(err => console.log("Firebase block sync delays. This is fine."));
            }
          }
        };

        // level configuration metrics
        const getLevelName = (xpValue) => {
          if (xpValue >= 3000) return 5;
          if (xpValue >= 1800) return 4;
          if (xpValue >= 1000) return 3;
          if (xpValue >= 450) return 2;
          return 1;
        };

        // Enemy calculations based on current XP
        const getEnemyDetails = (xpCount) => {
          if (xpCount >= 1800) {
            return { id: "yonex", name: "Interstellar Aura Yonex Bot", hp: 300, attackEffect: "Total standard XP freeze multiplier cuts", fierceness: "⭐⭐⭐⭐⭐" };
          } else if (xpCount >= 450) {
            return { id: "victor", name: "Elite Victor Striker Pack", hp: 200, attackEffect: "50% checkmarks rate coin cuts", fierceness: "⭐⭐⭐" };
          } else {
            return { id: "lining", name: "Rookie Li Ning Cadet", hp: 100, attackEffect: "1 coin stolen on day missed penalty", fierceness: "⭐⭐" };
          }
        };

        const getBossHealthPct = () => {
          const completedCount = habits.filter(h => h.completedToday).length;
          if (completedCount === 3) return 0;
          if (completedCount === 2) return 33;
          if (completedCount === 1) return 67;
          return 100;
        };

        // Complete Check checkmarks and smash animations
        const handleHabitToggle = (habitId) => {
          const target = habits.find(h => h.id === habitId);
          if (!target) return;

          if (target.completedToday) {
            // Uncheck
            const updated = habits.map(h => h.id === habitId ? { ...h, completedToday: false } : h);
            setHabits(updated);
            showToast("Drill mark undone.", "warning");
            saveState(profile, updated);
            return;
          }

          // Trigger vision or simulations modal eye scanner
          setSelectedHabitForAI(target);
        };

        const executeVerifyAward = (habitId, rewardXp, rewardCoins, aiFeedbackText) => {
          sound.playSmash();
          setIsSmashing(true);
          setEnemyShake(true);
          setSelectedHabitForAI(null);

          setTimeout(() => {
            setIsSmashing(false);
            setEnemyShake(false);
          }, 500);

          // Multiplier calculation depending on Level debuffs & Streaks
          let finalXpGain = rewardXp;
          let finalCoinsGain = rewardCoins;
          let bonusDeets = "";

          // Streak 2x XP Multipliers (Category C - maintaining high-consistency streak logs)
          if (profile.streak > 0) {
            finalXpGain = rewardXp * 2;
            bonusDeets += " (2x Streak XP Activated!)";
          }

          const currentEnemy = getEnemyDetails(profile.xp);
          // Victor cuts 50%
          if (currentEnemy.id === "victor") {
            finalXpGain = Math.round(finalXpGain * 0.5);
            finalCoinsGain = Math.round(finalCoinsGain * 0.5);
            bonusDeets += " [Victor Defense rate cut 50%]";
          }
          // Yonex blocks to 0
          if (currentEnemy.id === "yonex") {
            finalXpGain = 0;
            finalCoinsGain = 0;
            bonusDeets += " [Yonex cosmic freeze! 0 XP earnings]";
          }

          // Special Category C rule: first habit complete ever +10 coins
          const habitNode = habits.find(h => h.id === habitId);
          if (habitId === "habit1" && (habitNode.timesCompleted || 0) === 0) {
            finalCoinsGain += 10;
            showToast("🎖️ +10 First Completion Ever Coins!", "award");
          }

          // Update Habit counters
          const updatedHabits = habits.map(h => {
            if (h.id === habitId) {
              const strictNewStreak = h.streakCount + 1;
              
              // Fitness legend: habit 3 5-day consecutive streak grants +30 coins
              if (habitId === "habit3" && strictNewStreak % 5 === 0) {
                finalCoinsGain += 30;
                showToast("🔥 fitness Legend! +30 Coins Bonus on consecutive court lunges!", "award");
              }

              return {
                ...h,
                completedToday: true,
                timesCompleted: (h.timesCompleted || 0) + 1,
                streakCount: strictNewStreak
              };
            }
            return h;
          });

          // Check Perfect day achievement! (All 3 items ticked)
          const allTicked = updatedHabits.every(h => h.completedToday);
          let perfectBonusCoins = 0;
          let dailyStreakBonus = 0;
          if (allTicked) {
            perfectBonusCoins = 50; // Perfect day +50 Coins bonus
            dailyStreakBonus = 1;
            setShowPerfectBonusBanner(true);
            setTimeout(() => setShowPerfectBonusBanner(false), 3800);
            showToast("🏆 PERFECT ATHLETIC TRAINING DAY! +50 Coins & confettis", "award");
          }

          // Compute badge additions
          let newBadges = [...profile.badges];
          if (allTicked && !newBadges.includes("Perfect Athlete")) {
            newBadges.push("Perfect Athlete");
          }

          // Compute levels scale changes
          const startLvl = getLevelName(profile.xp);
          const nextXpTotal = profile.xp + finalXpGain;
          const endLvl = getLevelName(nextXpTotal);

          // Level Evolution trigger popup
          if (endLvl > startLvl) {
            sound.playLevelUp();
            setShowLevelUpCinematic(endLvl);
            if (endLvl === 2 && !newBadges.includes("Badminton Aspirant")) newBadges.push("Badminton Aspirant");
            if (endLvl === 3 && !newBadges.includes("Pro Court Striker")) newBadges.push("Pro Court Striker");
            if (endLvl === 4 && !newBadges.includes("Ultimate Court Overlord")) newBadges.push("Ultimate Court Overlord");
            if (endLvl === 5 && !newBadges.includes("God of Badminton")) newBadges.push("God of Badminton");
          }

          const freshProfile = {
            ...profile,
            xp: nextXpTotal,
            coins: profile.coins + finalCoinsGain + perfectBonusCoins,
            level: endLvl,
            streak: profile.streak + dailyStreakBonus,
            perfectDaysCount: profile.perfectDaysCount + (allTicked ? 1 : 0),
            badges: newBadges,
            hp: Math.min(100, profile.hp + 5) // Completing routine grants 5 stamina HP
          };

          setHabits(updatedHabits);
          setProfile(freshProfile);
          showToast(`Smash Hit! +${finalXpGain} XP | +${finalCoinsGain} Coins ${bonusDeets}`, "success");
          saveState(freshProfile, updatedHabits);

          // Increment Quest bounites
          const updatedQuests = challenges.map((ch) => {
            if (ch.id === "ch1") {
              const prev = ch.current;
              const next = Math.min(ch.target, prev + 1);
              const done = next >= ch.target;
              if (done && !ch.completed) {
                showToast(`🏆 Bounty Claimed: +${ch.rewardCoins} Coins!`, "award");
                sound.playCoin();
                setProfile(p => ({ ...p, coins: p.coins + ch.rewardCoins }));
              }
              return { ...ch, current: next, completed: done || ch.completed };
            }
            return ch;
          });
          setChallenges(updatedQuests);
        };

        // Reset Trainer habits daily manual button
        const handleManualReset = () => {
          showToast("Court training logs cleared for tomorrow's matches!", "streak");
          const resetHab = habits.map(h => ({ ...h, completedToday: false }));
          setHabits(resetHab);
          
          setProfile(p => {
            const updated = { ...p, hp: 100 }; // reset Stamina to full
            saveState(updated, resetHab);
            return updated;
          });
        };

        // Shop Transactions
        const handleItemBuy = (item) => {
          if (profile.purchasedItems.includes(item.id)) {
            // Equip weapon gear
            setProfile(prev => {
              let updated = { ...prev };
              if (item.category === "shirt") updated.currentShirt = item.value;
              if (item.category === "pants") updated.currentPants = item.value;
              if (item.category === "racket") updated.currentRacket = item.value;
              
              saveState(updated, habits);
              showToast(`Equipped Style: ${item.name}`, "success");
              return updated;
            });
            return;
          }

          if (profile.coins < item.cost) {
            showToast("Lacking sufficient athlete currency (Coins) for buy!", "warning");
            return;
          }

          // Procure gear
          sound.playCoin();
          setProfile(prev => {
            let freshPurchased = [...prev.purchasedItems, item.id];
            let activeBadges = [...prev.badges];
            if (item.id === "custom_shield" && !activeBadges.includes("Aegis Defender")) activeBadges.push("Aegis Defender");
            if (item.id === "real_life_break" && !activeBadges.includes("Relaxation Guru")) activeBadges.push("Relaxation Guru");

            const updated = {
              ...prev,
              coins: prev.coins - item.cost,
              purchasedItems: freshPurchased,
              badges: activeBadges
            };
            saveState(updated, habits);
            showToast(`Purchased item: ${item.name}! Claimed.`, "shop");
            return updated;
          });
        };

        const upgradeSmashLevel = () => {
          if (profile.coins < 20) {
            showToast("Lacking 20 Coins for Smashing Power!", "warning");
            return;
          }
          if (profile.smashPowerLevel >= 5) {
            showToast("Smashing power fully optimized!", "warning");
            return;
          }
          sound.playCoin();
          setProfile(prev => {
            const updated = {
              ...prev,
              coins: prev.coins - 20,
              smashPowerLevel: prev.smashPowerLevel + 1
            };
            saveState(updated, habits);
            showToast(`Enhanced Smash Racket power! Tier ${prev.smashPowerLevel + 1}/5`, "success");
            return updated;
          });
        };

        // Athlete text logger diary list
        const handleAddNote = () => {
          if (!journalNote.trim()) return;
          const fresh = {
            date: new Date().toLocaleDateString(),
            note: journalNote
          };
          const updatedLogs = [fresh, ...journalEntries];
          setJournalEntries(updatedLogs);
          localStorage.setItem("setgo_logs", JSON.stringify(updatedLogs));
          setJournalNote("");
          showToast("Logged routine review entries!", "success");
        };

        // Clean database memory
        const handleFormatDatabase = () => {
          localStorage.removeItem("setgo_prof");
          localStorage.removeItem("setgo_habits");
          localStorage.removeItem("setgo_chall");
          localStorage.removeItem("setgo_logs");
          window.location.reload();
        };

        // --- Simulated AI Coach Lab logic hooks ---
        const runAIPlateScanEvent = () => {
          if (!mealText.trim()) {
            showToast("Provide your culinary meal descriptions first!", "warning");
            return;
          }
          setAiProcessing(true);
          sound.playSmash();
          setTimeout(() => {
            setAiProcessing(false);
            const food = mealText.toLowerCase();
            const colors = [];
            if (food.includes("spinach") || food.includes("broccoli") || food.includes("green") || food.includes("apple") || food.includes("avocado")) colors.push("Green");
            if (food.includes("tomato") || food.includes("berry") || food.includes("pepper") || food.includes("apple")) colors.push("Red");
            if (food.includes("egg") || food.includes("banana") || food.includes("lemon") || food.includes("cheese") || food.includes("mango")) colors.push("Yellow");
            
            const met = colors.length >= 2;
            const rewardCoins = met ? 15 : 5;
            const rewardXp = met ? 20 : 10;

            const personaSignatures = {
              coach_li_ning: "Coach Li Ning says: Excellent organic mineral colors found in layout! Good badminton wrist muscle fluid circulation.",
              drill_sergeant: "DRILL SERGEANT ROARS: STRIKER DIG OVER HIGH-PROTEIN FOODS! STAMINA STABILIZED! BACK ON COMPRESSION COURTS!",
              sarcastic_robot: "BEEP-BOOP: YOUR MEAL CONTAINS REAL NUTRITION INDEXES. ANIMAL FEEDBACK ENGINE DELLS IT SATISFACTORY."
            };

            setMealResult({
              metColors: colors.length > 0 ? colors : ["Beige/Standard"],
              ruleMet: met,
              feedbackText: met 
                ? `${personaSignatures[coachSpeechStyle]} Gorgeous plate variety satisfying the classic 3-Color Rule. +15 Coins bonus awarded!`
                : `${personaSignatures[coachSpeechStyle]} Color balance sparse. Pack green celery or banana items next turn to avoid insulin crashes!`
            });

            setProfile(p => ({ ...p, coins: p.coins + rewardCoins, xp: p.xp + rewardXp }));
            showToast("Healthy Nutrition Verified!", "award");
          }, 1400);
        };

        const handleFeynmanTutorToggle = () => {
          if (!feynmanText.trim()) return;
          setAiProcessing(true);
          setTimeout(() => {
            setAiProcessing(false);
            const grading = feynmanText.split(" ").length >= 10 ? "Optimal Veteran Mastery (A)" : "Rookie Outline (B)";
            setFeynmanResult({

                  <div className="space-y-3.5 text-left">
                    <span className="text-zinc-500 text-[9.5px] font-mono font-black uppercase tracking-widest block">📝 TRADITIONAL ATHLETE DIARY RECORDS</span>
                    
                    <div className="bg-[#0B0B0B] border border-zinc-900 p-4 rounded-[22px] space-y-3">
                      <span className="text-[9px] text-gray-500 font-mono uppercase font-bold block">Type athletic workout diary logs</span>
                      <textarea 
                        value={journalNote}
                        onChange={(e) => setJournalNote(e.target.value)}
                        placeholder="Add athlete performance notes, e.g. hydrated 3 liters, studies finished, court aerobics complete!"
                        className="w-full h-18 bg-[#111] border border-zinc-800 rounded-xl p-3 text-xs focus:outline-none focus:border-secondary text-white placeholder-zinc-700"
                      />
                      <div className="flex justify-end">
                        <button 
                          onClick={handleAddNote}
                          className="bg-secondary text-primary font-black text-[10px] uppercase tracking-wider px-4 py-1.5 rounded-full select-none"
                        >
                          Send Log entry
                        </button>
                      </div>
                    </div>

                    <div className="space-y-2.5">
                      {journalEntries.map((l, idx) => (
                        <div key={idx} className="p-4 bg-[#0A0A0A] border border-zinc-900 rounded-[22px] space-y-1 shadow-md">
                          <div className="flex justify-between items-center text-[8.5px] text-secondary font-mono">
                            <span className="font-extrabold tracking-wider uppercase">ROUTINE JOURNAL NOTES</span>
                            <span>{l.date}</span>
                          </div>
                          <p className="text-xs text-zinc-300 font-sans italic font-medium leading-relaxed">"{l.note}"</p>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* SCREEN 5: MORE / CONFIGS */}
              {activeTab === "more" && (
                <div className="space-y-4 text-left">
                  <h2 className="text-xs uppercase font-black text-gray-400 tracking-wider">🛠️ Global Systems Console</h3>
                  
                  {/* Grid of details */}
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { id: "leaderboard", name: "Scoreboards", icon: "🏆" },
                      { id: "calendar", name: "Heatmap Date", icon: "📅" },
                      { id: "challenges", name: "Bounties Quests", icon: "⚔️" },
                      { id: "specs", name: "Athlete Specs", icon: "🏸" },
                    ].map(sub => (
                      <button 
                        key={sub.id}
                        onClick={() => setMoreSubTab(sub.id)}
                        className={`p-3 rounded-2xl border flex items-center space-x-2.5 text-[10px] font-black uppercase tracking-wider text-left transition-all duration-100 ${
                          moreSubTab === sub.id 
                            ? "bg-secondary text-[#0E0E0E] border-secondary font-black" 
                            : "bg-[#0B0B0B] text-gray-400 border-zinc-900 hover:border-zinc-800"
                        }`}
                      >
                        <span className="text-sm">{sub.icon}</span>
                        <span>{sub.name}</span>
                      </button>
                    ))}
                  </div>

                  <div className="border-t border-zinc-850 pt-4">
                    {/* MORE TAB sub-option 1: SCOREBOARDS */}
                    {moreSubTab === "leaderboard" && (
                      <div className="space-y-3.5">
                        <span className="text-zinc-500 font-mono text-[9px] uppercase font-bold block">Athletes leaderboard rankings</span>
                        <div className="space-y-2">
                          {LEADERBOARD_USERS.map((l, i) => (
                            <div key={i} className="p-3 bg-[#0A0A0A] rounded-2xl border border-zinc-900 flex justify-between items-center text-xs">
                              <div className="flex items-center space-x-3">
                                <span className="font-mono font-black text-gray-500">#{l.rank}</span>
                                <div>
                                  <h4 className="font-bold text-white leading-none">{l.name}</h4>
                                  <span className="text-[8px] text-secondary font-mono uppercase font-bold">{l.racket}</span>
                                </div>
                              </div>
                              <span className="bg-[#111] px-2 py-0.5 rounded border border-white/5 font-mono text-[9.5px] font-black">LV. {l.level}</span>
                            </div>
                          ))}

                          {/* Current user */}
                          <div className="p-3 bg-secondary/15 rounded-2xl border-2 border-secondary/40 flex justify-between items-center text-xs">
                            <div className="flex items-center space-x-3">
                              <span className="font-mono font-black text-secondary">#4</span>
                              <div>
                                <h4 className="font-bold text-white leading-none">Offline Athlete (You)</h4>
                                <span className="text-[8.5px] text-zinc-500 font-mono uppercase font-bold capitalize">{profile.currentRacket} racket style</span>
                              </div>
                            </div>
                            <span className="bg-secondary text-[#0D0D0D] font-extrabold px-2.5 py-0.5 rounded-full font-mono text-[9px]">LV. {profile.level}</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* MORE TAB sub-option 2: CALENDAR HEATMAP */}
                    {moreSubTab === "calendar" && (
                      <div className="space-y-3">
                        <span className="text-zinc-500 font-mono text-[9px] uppercase font-bold block">Routine streak calendars</span>
                        <div className="p-4 bg-[#0B0B0B] border border-zinc-900 rounded-[22px]">
                          <div className="grid grid-cols-7 gap-2.5 border-b border-zinc-800 pb-2 text-center text-[8.5px] font-mono text-[#00FFCC] font-bold">
                            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                          </div>
                          <div className="grid grid-cols-7 gap-2 pt-3 text-center text-[10px] font-mono font-extrabold">
                            {[true, true, false, true, true, true, habits.every(h => h.completedToday)].map((ok, i) => (
                              <div key={i} className={`aspect-square rounded-lg flex items-center justify-center ${ok ? "bg-secondary text-[#0E0E0E]" : "bg-[#1C1C1C] text-zinc-700"}`}>
                                <span>{i + 15}</span>
                              </div>
                            ))}
                          </div>
                          <span className="text-[8.5px] text-zinc-500 block pt-3 leading-normal">Highlighted green days represents core habits fully marked for those historical dates.</span>
                        </div>
                      </div>
                    )}

                    {/* MORE TAB sub-option 3: QUESTS */}
                    {moreSubTab === "challenges" && (
                      <div className="space-y-3.5">
                        <span className="text-zinc-500 font-mono text-[9px] uppercase font-bold block">Strategic Quests roadmaps</span>
                        <div className="space-y-2.5">
                          {challenges.map((ch, i) => (
                            <div key={i} className="p-3.5 bg-[#090909] border border-zinc-900 rounded-[22px] space-y-2 text-xs">
                              <div className="flex justify-between items-start">
                                <div>
                                  <h4 className="font-bold text-white leading-none">{ch.name}</h4>
                                  <p className="text-[9.5px] text-gray-500 leading-normal pt-1">{ch.description}</p>
                                </div>
                                <span className="bg-amber-900/10 text-amber-400 font-mono text-[9px] font-black border border-amber-950 px-2 py-0.5 rounded">+{ch.rewardCoins} c.</span>
                              </div>
                              <div className="flex items-center space-x-3 font-mono text-[9.5px]">
                                <div className="flex-1 bg-zinc-900 h-1.5 rounded-full overflow-hidden">
                                  <div className="bg-[#00FFCC] h-full" style={{ width: `${(ch.current/ch.target)*100}%` }}></div>
                                </div>
                                <span className="text-secondary font-black">{ch.completed ? "Done" : `${ch.current}/${ch.target}`}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* MORE TAB sub-option 4: ANIME EVOLUTIONS */}
                    {moreSubTab === "specs" && (
                      <div className="space-y-3">
                        <span className="text-zinc-500 font-mono text-[9px] uppercase font-bold block">Protagonist specs evolution deck</span>
                        <div className="p-4 bg-[#0B0B0B] rounded-[22px] border border-zinc-900 text-xs text-zinc-300 space-y-2.5">
                          <div className="grid grid-cols-2 gap-2 text-[10px] font-mono font-bold uppercase tracking-tight">
                            <span className="text-zinc-500">Racket Custom:</span>
                            <span className="text-white select-none capitalize">{profile.currentRacket} standard</span>
                            <span className="text-zinc-500">Active Jersey:</span>
                            <span className="text-white select-none capitalize">{profile.currentShirt} jersey</span>
                            <span className="text-zinc-500">Defensive Shields:</span>
                            <span className="text-secondary select-none">{profile.purchasedItems.includes("custom_shield") ? "ENABLED (Aegis)" : "NONE"}</span>
                          </div>
                          <div className="border-t border-zinc-850 pt-2.5">
                            <span className="text-[8px] font-mono text-[#00FFCC] font-black block uppercase tracking-wider">Evolution state details</span>
                            {profile.level === 1 && <p className="text-[10px] text-gray-500 pt-1 font-bold">Rookie Recruits stance: Holding basic wooden court frames, casual wear. Evolve to Level 2 to trigger shoes and shuttle athletics.</p>}
                            {profile.level === 2 && <p className="text-[10px] text-gray-400 pt-1 font-bold">Aspirant Ace: Sporting proper court trainers and standard graphics movement trails.</p>}
                            {profile.level === 3 && <p className="text-[10px] text-gray-400 pt-1 font-bold">Pro Court Striker: Wear pro teal jerseys, emitting neon pink graphics sparkles.</p>}
                            {profile.level >= 4 && <p className="text-[10px] text-amber-300 pt-1 font-bold">Crowned Badminton Overlord God: Floating glowing halo rings, emitting majestic gold-dust dynamic particles.</p>}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* RESET MATRIX */}
                  <div className="bg-[#0D0D0D] border border-[#FF3366]/20 p-4 rounded-[22px] flex items-center justify-between text-left mt-6">
                    <div className="max-w-[70%] space-y-0.5">
                      <h4 className="text-xs font-bold text-white uppercase">Format Memory Matrix</h3>
                      <p className="text-[10px] text-zinc-500 font-bold leading-normal">Erase absolute offline sandboxes files cached and stats.</p>
                    </div>
                    <button 
                      onClick={handleFormatDatabase}
                      className="bg-accent/15 border border-accent/20 text-accent font-mono text-[9px] px-3.5 py-1.5 rounded-full uppercase active:scale-90 duration-100 font-black hover:bg-accent hover:text-white"
                    >
                      Delete Profile
                    </button>
                  </div>

                </div>
              )}

            </main>

            {/* FLOATING FOOTER NAVIGATION MENU (Category A - bottom navbar overlays screens) */}
            <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 z-40 bg-[#0E0E0E]/95 border-t border-[#1C1C1C] shadow-[0_-8px_20px_rgba(0,0,0,0.4)] flex items-center justify-around w-full max-w-[480px] pb-safe pt-2 px-3 h-18">
              {[
                { id: "home", name: "Arena", icon: "🏸" },
                { id: "stats", name: "Stats", icon: "📊" },
                { id: "shop", name: "Shop", icon: "🛍️" },
                { id: "journal", name: "AI Coach", icon: "🧬" },
                { id: "more", name: "More", icon: "🛠️" },
              ].map((tab) => {
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center p-2.5 min-w-[56px] transition-all duration-100 cursor-pointer select-none active:scale-90 relative ${
                      active ? "text-secondary" : "text-gray-400 hover:text-white"
                    }`}
                  >
                    {active && (
                      <div className="absolute top-0 w-6 h-[2.5px] bg-[#FF3366] rounded-full shadow-[0_3px_8px_#FF3366]" style={{ top: "-8px" }}></div>
                    )}
                    <span className="text-lg leading-none active:scale-95">{tab.icon}</span>
                    <span className="text-[8px] font-mono tracking-wider text-shadow font-extrabold uppercase pt-1">{tab.name}</span>
                  </button>
                );
              })}
            </nav>

            {/* DYNAMIC LEVEL UP CINEMATIC DIALOGS */}
            {showLevelUpCinematic !== null && (
              <div className="fixed inset-0 z-50 bg-[#000000]/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center select-none">
                <span className="text-[#00FFCC] font-mono text-xs font-black tracking-widest uppercase animate-pulse mb-1 block">EVOLUTION MATRIX AWAKENED</span>
                <h1 className="text-3xl font-black text-white uppercase tracking-tight">PLAYER LEVEL {showLevelUpCinematic} REACHED!</h1>
                
                <div className="w-28 h-28 my-6 rounded-full bg-[#111] border-2 border-secondary p-4 flex items-center justify-center shadow-inner filter drop-shadow-[0_0_12px_rgba(0,255,204,0.3)] select-none">
                  <span className="text-amber-400 font-sans font-black text-sm uppercase italic tracking-wider animate-bounce">GOD MODE UNLOCKED</span>
                </div>

                <p className="text-[11px] text-[#A0AEC0] font-sans font-bold leading-relaxed px-5 max-w-xs mb-6">
                  Congratulations ace! Your stamina parameters, power spikes, and defense scores evolved to a pro badminton challenger standard!
                </p>

                <button 
                  onClick={() => setShowLevelUpCinematic(null)}
                  className="bg-secondary text-primary font-black px-8 py-3 rounded-full text-xs hover:opacity-90 active:scale-95 duration-100 uppercase tracking-widest"
                >
                  Return to Arena
                </button>
              </div>
            )}

            {/* PERFECT DAYS BONUS HUD BANNER OUTLETS */}
            {showPerfectBonusBanner && (
              <div className="fixed bottom-22 left-1/2 -translate-x-1/2 z-40 bg-secondary/15 border border-secondary px-5 py-2.5 rounded-full shadow-[0_0_20px_#00FFCC] backdrop-blur-md pointer-events-none uppercase flex items-center space-x-2 animate-bounce">
                <span>🏆</span>
                <span className="text-[9.5px] font-black text-white tracking-widest">PERFECT TRAINING DAY MET! +50 COINS</span>
              </div>
            )}

            {/* ACTIVE VERIFIER GLOBAL MODALS */}
            <GymEyeModal 
              isOpen={selectedHabitForAI !== null} 
              habit={selectedHabitForAI} 
              onClose={() => setSelectedHabitForAI(null)} 
              onVerified={executeVerifyAward} 
              showToast={showToast} 
            />

            {/* GLOBAL TOAST FEEDBACK OUTLET */}
            <ToastContainer toasts={toasts} removeToast={removeToast} />

          </div>
        );
      }

      // ----------------- MOUNT TO ROOT -----------------
      const rootElement = document.getElementById("root");
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
